[workspace]
resolver = "2"
members = ["crates/art-term-core", "crates/art-term-gui", "crates/tauri-plugin-mobile-vault", "crates/tauri-plugin-mobile-voice", "crates/tauri-plugin-mobile-history"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-tungstenite = "0.24"
sha2 = "0.10"
anyhow = "1"
