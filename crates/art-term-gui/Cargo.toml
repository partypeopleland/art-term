[package]
name = "art-term-gui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "art-term-gui"
path = "src/desktop/main.rs"

[lib]
name = "art_term_mobile"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
art-term-core = { path = "../art-term-core" }
serde_json.workspace = true
serde.workspace = true

[dependencies]
art-term-core = { path = "../art-term-core" }
tauri = { version = "2", features = [] }
tokio.workspace = true
serde.workspace = true
sha2.workspace = true
anyhow.workspace = true
base64 = "0.22"
url = "=2.5.8"
zeroize = "1.8"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-clipboard-manager = "=2.4.1"
tauri-plugin-dialog = "=2.8.0"
tauri-plugin-fs = "=2.6.0"
serde_json.workspace = true
tempfile = "3"

[dev-dependencies]
serde_json.workspace = true
art-term-core = { path = "../art-term-core" }
rcgen = { version = "=0.13.2", features = ["ring"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "=0.24.0", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", features = ["sink"] }

[target.'cfg(target_os = "android")'.dependencies]
art-term-core = { path = "../art-term-core" }
tauri-plugin-mobile-vault = { path = "../tauri-plugin-mobile-vault" }
tauri-plugin-mobile-voice = { path = "../tauri-plugin-mobile-voice" }
tauri-plugin-mobile-history = { path = "../tauri-plugin-mobile-history" }

[features]
openab-fixture = ["art-term-core/openab-fixture"]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(target_os = "linux")'.dependencies]
aes-gcm = { version = "=0.10.3", features = ["zeroize"] }
getrandom = "=0.3.4"
gio = "=0.18.4"
libc = "0.2"
secret-service = { version = "=5.2.0", default-features = false, features = ["rt-async-io-crypto-rust"] }
