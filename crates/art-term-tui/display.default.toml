# 原生圖片預覽；不使用彩色字格或其他模擬圖片。修改後重新啟動 art-term。
# auto 僅啟用已確認的本地 Sixel 終端；目前自動辨識 XTerm(390)／TERM=vt340。
# SSH、tmux／screen 及 Linux 純文字主控台停用預覽，桌面工具仍可給 AI 使用。
image_mode = "auto"

# 確認本地直接終端支援 Sixel 後，可設 image_mode = "sixel"。
# 優先讀取 TTY 實際字格像素；未提供時須填該終端的實際值，不可猜測。
# cell_width = 8
# cell_height = 16
# 舊 compatible 值僅作 auto 別名，不再使用字格圖片；已有設定檔不會覆寫。
