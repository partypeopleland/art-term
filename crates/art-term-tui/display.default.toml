# 圖片顯示模式，修改後重新啟動 art-term。此檔不含連線或憑證。
# compatible 使用彩色文字格；放大檢視與縮放可看原圖細節，但仍受文字格解析度限制。
image_mode = "compatible"

# 僅在確認直接使用的終端支援 Sixel 時，改成 image_mode = "sixel"。
# 原生模式需要正確的字元像素尺寸。優先讀取 TTY 的視窗像素資訊；
# 若 SSH 沒有提供，請填該終端的實際尺寸。以下只是格式範例，不是建議值。
# cell_width = 8
# cell_height = 16
# 本程式不向 stdin 發送圖片能力／字格像素查詢，也不修改 tmux 設定；原生模式目前限直接終端。
