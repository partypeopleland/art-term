# 修改後重新啟動 art-term 生效。leader+h 表示先按 leader、放開，再按 h。
# 每項可設定多組快捷鍵；空陣列 [] 停用該操作的快捷鍵，仍可用滑鼠或選單。
# 支援 Ctrl/Alt/Shift、單一字元、F1..F24、方向鍵、Enter、Esc、Tab 等。
# 表單優先處理本地導覽；終端焦點的普通方向鍵仍送給遠端。
leader = "Ctrl+]"

[bindings]
hosts = ["F2", "leader+h"]
terminal = ["F3", "leader+t"]
preview = ["leader+v"]
screens = ["F4", "leader+c"]
shells = ["leader+s"]
create = ["leader+n"]
previous = ["leader+p"]
next = ["leader+l"]
close = ["leader+w"]
up = ["leader+u"]
down = ["leader+d"]
follow = ["leader+f"]
recover = ["leader+r"]
import = ["leader+i"]
export = ["leader+e"]
help = ["F1", "leader+?"]
quit = ["leader+q"]
actions = ["F10"]
focus_next = ["leader+Tab"]
edit = []
delete = []
test = []
refresh = []
new_host = []
new_agent = []
new_screen = []
tree_up = []
tree_down = []
tree_activate = []
tab_1 = ["leader+1"]
tab_2 = ["leader+2"]
tab_3 = ["leader+3"]
tab_4 = ["leader+4"]
tab_5 = ["leader+5"]
tab_6 = ["leader+6"]
tab_7 = ["leader+7"]
tab_8 = ["leader+8"]
tab_9 = ["leader+9"]

[navigation]
up = ["Up"]
down = ["Down"]
activate = ["Enter"]
cancel = ["Esc"]
next_field = ["Tab"]
previous_field = ["Shift+Tab"]
save = ["Ctrl+s"]
toggle_replace = ["Space"]
